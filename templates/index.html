<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(to right, #2c3e50, #3498db);
      color: white;
    }
    .container {
      margin-top: 5%;
      background: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 20px;
    }
    textarea {
      resize: none;
    }
    .btn-primary {
      background-color: #e67e22;
      border: none;
    }
    .alert-info {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 10px;
    }
    /* Fade-in animation for summary */
    .summary-fade {
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <h1 class="mb-4">📝 Text Summarizer</h1>
    <form method="POST" action="/">
      <div class="form-group">
        <textarea name="text" rows="8" class="form-control mb-4" placeholder="Paste your text here..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Summarize</button>
    </form>

    {% if summary %}
    <hr />
    <h4 class="mt-4">📌 Summary:</h4>
    <div class="alert alert-info mt-3 summary-fade">{{ summary }}</div>
    {% endif %}
  </div>
</body>
</html>
